name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Regenerate Gradle wrapper for version 9.3.1
        run: |
          # Use Gradle's official wrapper generator to create valid wrapper
          # This ensures gradle-wrapper.jar, gradle-wrapper.properties are correctly generated
          mkdir -p gradle/wrapper
          
          # Download and execute the Gradle wrapper generator
          # This will download gradle-9.3.1 and generate valid wrapper files
          java -jar gradle/wrapper/gradle-wrapper.jar --version 2>/dev/null || {
            echo "Wrapper JAR invalid or missing. Regenerating wrapper files..."
            
            # Use gradle-cli to generate wrapper for 9.3.1
            # First, download a temporary gradle distribution to access the wrapper generator
            curl -s "https://services.gradle.org/distributions/gradle-9.3.1-bin.zip" -o /tmp/gradle-9.3.1-bin.zip
            unzip -q /tmp/gradle-9.3.1-bin.zip -d /tmp/
            
            # Use the downloaded gradle to generate the wrapper for this project
            /tmp/gradle-9.3.1/bin/gradle wrapper --gradle-version 9.3.1
            
            # Verify the wrapper JAR was created and is valid
            if [ ! -f gradle/wrapper/gradle-wrapper.jar ] || [ ! -s gradle/wrapper/gradle-wrapper.jar ]; then
              echo "Error: Failed to generate gradle-wrapper.jar"
              exit 1
            fi
            
            # Verify it's a valid ZIP/JAR file (magic bytes: PK)
            MAGIC=$(xxd -p -l 2 gradle/wrapper/gradle-wrapper.jar)
            if [ "$MAGIC" != "504b" ]; then
              echo "Error: Generated JAR is not valid (magic bytes: $MAGIC)"
              exit 1
            fi
            
            JAR_SIZE=$(stat -f%z gradle/wrapper/gradle-wrapper.jar 2>/dev/null || stat -c%s gradle/wrapper/gradle-wrapper.jar)
            echo "Successfully regenerated gradle-wrapper.jar (${JAR_SIZE} bytes)"
          }

      - name: Build APK
        run: chmod +x ./gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NaijaReward-Hub-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: List build outputs
        run: find app/build/outputs -type f -name "*.apk" 2>/dev/null && echo "APK generated successfully" || echo "No APK files found"
