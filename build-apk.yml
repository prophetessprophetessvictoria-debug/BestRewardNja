name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: 11
          distribution: 'temurin'

      - name: Download official Gradle 9.3.1 wrapper JAR
        run: |
          mkdir -p gradle/wrapper
          cd gradle/wrapper
          curl -L -o gradle-wrapper.jar "https://services.gradle.org/distributions/gradle-9.3.1-wrapper.jar"
          # Verify file exists and is not empty
          if [ ! -s gradle-wrapper.jar ]; then
            echo "Failed to download gradle-wrapper.jar"
            exit 1
          fi
          echo "Downloaded gradle-wrapper.jar ($(stat -f%z gradle-wrapper.jar 2>/dev/null || stat -c%s gradle-wrapper.jar) bytes)"
          cd ../..

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: BestRewardNja-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: List build outputs
        run: find app/build/outputs -type f -name "*.apk" 2>/dev/null || echo "No APK files found"
